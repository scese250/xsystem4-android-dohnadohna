name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a

    steps:
    - uses: actions/checkout@v6

    - name: Install Deps
      run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison

    - name: Cache Native Build
      uses: actions/cache@v4
      with:
        path: build/arm64-v8a
        key: native-arm64-${{ runner.os }}-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'build-shared-libs.sh', 'xsystem4/CMakeLists.txt', 'xsystem4/subprojects/libsys4/CMakeLists.txt') }}
        restore-keys: |
          native-arm64-${{ runner.os }}-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'build-shared-libs.sh') }}
          native-arm64-${{ runner.os }}-v1-

    - name: Native Build
      run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./build-shared-libs.sh

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('project/**/*.gradle*', 'project/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: App Build
      run: |
        cd project
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk xsystem4-arm64-release.apk
        else
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk xsystem4-arm64-debug.apk
        fi
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: xsystem4-arm64-apk
        path: project/xsystem4-arm64-*.apk
